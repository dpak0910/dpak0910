
name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: dpak0910
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=%23161B22%230E3A44%230E6A7A%2314A3B8%2322D3EE

      - name: Publish generated SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: dpak0910
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=%23161B22%2C%230E3A44%2C%230E6A7A%2C%2314A3B8%2C%2322D3EE
