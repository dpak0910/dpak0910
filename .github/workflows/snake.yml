
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: dpak0910
          outputs: |
            dist/github-snake.svg?color_snake=%23A78BFA&color_dots=%230D1117%2316102A%233B2D65%236B4FA3%23A78BFA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
